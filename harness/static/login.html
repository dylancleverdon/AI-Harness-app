<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Harness — sign in</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-page">
<form id="login" class="panel login-box">
  <h3>AI Harness</h3>
  <p class="muted">Sign in with the remote access password set on your Mac.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus>
  <button class="primary">Sign in</button>
  <p id="msg" class="muted"></p>
</form>
<script src="/static/login.js"></script>
</body>
</html>
